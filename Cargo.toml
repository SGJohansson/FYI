[package]
name = "fyi"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A colorful, WSL2-aware ls and tree replacement for Linux."
license = "Apache-2.0"
repository = "https://github.com/SGJohansson/fyi"
readme = "README.md"
keywords = ["ls", "tree", "wsl", "cli", "filesystem"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-width = "0.2.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
